<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Assets/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center justify-content-center">
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-12">
                <div class="glass-card p-5">
                    <div class="text-center mb-5">
                        <h1 class="title-glow display-4">
                            <i class="fas fa-birthday-cake icon-pulse"></i> Life Calculator
                        </h1>
                        <p class="text-white opacity-80 fs-5">Enter your birthdate & see magic</p>
                    </div>

                    <div class="row justify-content-center mb-4">
                        <div class="col-md-6">
                            <input type="date" id="udb1" class="form-control input-box" required>
                        </div>
                    </div>

                    <div class="text-center mb-5">
                        <button onclick="clk()" class="btn btn-premium btn-lg">
                            <i class="fas fa-magic"></i> CHECK NOW
                        </button>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-6">
                            <div class="result-card">
                                <i class="fas fa-calendar-day fa-3x text-white mb-3"></i>
                                <h4 class="text-white">Total Days Lived</h4>
                                <div class="big-number" id="udb2">0</div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="result-card">
                                <i class="fas fa-user-clock fa-3x text-white mb-3"></i>
                                <h4 class="text-white">Your Age</h4>
                                <div class="big-number" id="udb3">0</div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <small class="text-white opacity-60">MADE WITH <i class="fas fa-heart text-danger"></i> MUZAMMIL</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="Assets/script.js"></script>

</html>
